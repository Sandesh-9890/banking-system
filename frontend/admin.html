<!DOCTYPE html>
<html>

<head>

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <h1>🏦 Bank Admin Panel</h1>

        <div>

            <button onclick="toggleDarkMode()">
                🌙 Dark Mode
            </button>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </nav>

    <div class="container">

        <!-- Admin Profile -->

        <div class="profile-card">

            <i class="fa-solid fa-user-tie profile-icon"></i>

            <h2>Manager Dashboard</h2>

            <p>
                Manage customer accounts and transactions
            </p>

        </div>


        <!-- Search -->

        <div class="card">

            <h3>
                <i class="fa-solid fa-magnifying-glass"></i>
                Search Account
            </h3>

            <input type="number" id="searchId" placeholder="Enter Account ID">

            <button onclick="searchAccount()">
                Search
            </button>

            <ul id="searchResult"></ul>

        </div>

        <!-- Create Account -->

        <div class="card">

            <h3>
                <i class="fa-solid fa-user-plus"></i>
                Create Account
            </h3>

            <input type="text" id="createName" placeholder="Enter Name">

            <input type="email" id="createEmail" placeholder="Enter Email">

            <input type="number" id="createBalance" placeholder="Initial Balance">

            <button onclick="createAccount()">
                Create Account
            </button>

            <p id="createMessage"></p>

        </div>


        <!-- All Accounts -->

        <div class="card">

            <h3>
                <i class="fa-solid fa-users"></i>
                All Accounts
            </h3>

            <button onclick="loadAccounts()">
                Load Accounts
            </button>

            <ul id="accountsList"></ul>

        </div>

        <!-- Freeze Account -->

        <div class="card">

            <h3>
                <i class="fa-solid fa-lock"></i>
                Freeze Account
            </h3>

            <input type="number" id="freezeId" placeholder="Account ID">

            <button onclick="freezeAccount()">
                Freeze
            </button>

            <p id="freezeMessage"></p>

        </div>

        <!-- Unfreeze Account -->

        <div class="card">

            <h3>
                <i class="fa-solid fa-lock-open"></i>
                Unfreeze Account
            </h3>

            <input type="number" id="unfreezeId" placeholder="Account ID">

            <button onclick="unfreezeAccount()">
                Unfreeze
            </button>

            <p id="unfreezeMessage"></p>

        </div>

        <!-- Delete Account -->

        <div class="card">

            <h3>
                <i class="fa-solid fa-trash"></i>
                Delete Account
            </h3>

            <input type="number" id="deleteId" placeholder="Account ID">

            <button onclick="deleteAccount()">
                Delete
            </button>

            <p id="deleteMessage"></p>

        </div>

        <!-- Transactions -->

        <div class="card">

            <h3>
                <i class="fa-solid fa-clock-rotate-left"></i>
                All Transactions
            </h3>

            <button onclick="loadTransactions()">
                Load Transactions
            </button>

            <ul id="transactionList"></ul>

        </div>

    </div>

    <script>

        function toggleDarkMode() {

            document.body.classList.toggle("dark-mode");
        }

        function logout() {

            localStorage.clear();

            window.location.href = "index.html";
        }

        async function loadAccounts() {

            const token = localStorage.getItem("token");

            const response = await fetch(
                "http://localhost:8080/accounts",
                {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            const data = await response.json();

            const list =
                document.getElementById("accountsList");

            list.innerHTML = "";

            data.forEach(acc => {

                const li =
                    document.createElement("li");

                li.innerHTML =
                    "<strong>ID:</strong> " + acc.id +
                    "<br><strong>Name:</strong> " + acc.name +
                    "<br><strong>Email:</strong> " + acc.email +
                    "<br><strong>Balance:</strong> ₹" + acc.balance;

                list.appendChild(li);
            });
        }

        async function searchAccount() {

            const id =
                document.getElementById("searchId").value;

            const token =
                localStorage.getItem("token");

            const response = await fetch(
                `http://localhost:8080/accounts/${id}`,
                {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            const data = await response.json();

            const list =
                document.getElementById("searchResult");

            list.innerHTML = "";

            const li =
                document.createElement("li");

            li.innerHTML =
                "<strong>ID:</strong> " + data.id +
                "<br><strong>Name:</strong> " + data.name +
                "<br><strong>Email:</strong> " + data.email +
                "<br><strong>Balance:</strong> ₹" + data.balance;

            list.appendChild(li);
        }

        async function freezeAccount() {

            document.getElementById("freezeMessage")
                .innerText =
                "Backend freeze API pending";
        }

        async function unfreezeAccount() {

            document.getElementById("unfreezeMessage")
                .innerText =
                "Backend unfreeze API pending";
        }

        async function deleteAccount() {

            document.getElementById("deleteMessage")
                .innerText =
                "Backend delete API pending";
        }

        async function loadTransactions() {

            const token =
                localStorage.getItem("token");

            const response = await fetch(
                "http://localhost:8080/accounts/transactions",
                {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            const data = await response.json();

            const list =
                document.getElementById("transactionList");

            list.innerHTML = "";

            data.forEach(t => {

                const li =
                    document.createElement("li");

                li.innerHTML =
                    "<strong>Type:</strong> " + t.type +
                    "<br><strong>Amount:</strong> ₹" + t.amount +
                    "<br><strong>From:</strong> " + t.fromAccountId +
                    "<br><strong>To:</strong> " + t.toAccountId;

                list.appendChild(li);
            });
        }

    </script>

</body>

</html>
